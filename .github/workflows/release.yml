name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v12.6.1"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_EMBED_VERSION: "3.13.7"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = '${{ github.ref_name }}'
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag"
          }

          $version = $tag.Substring(1)

          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare embedded Python runtime
        shell: pwsh
        run: |
          $url = "https://www.python.org/ftp/python/${env:PYTHON_EMBED_VERSION}/python-${env:PYTHON_EMBED_VERSION}-embed-amd64.zip"
          $zip = Join-Path $env:RUNNER_TEMP "python-embed.zip"

          Invoke-WebRequest -Uri $url -OutFile $zip

          if (Test-Path runtime) {
            Remove-Item runtime -Recurse -Force
          }

          New-Item -ItemType Directory runtime | Out-Null
          Expand-Archive -Path $zip -DestinationPath runtime -Force

      - name: Set application version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          $py = Get-Content parts_manager.py -Raw -Encoding UTF8
          $py = [regex]::Replace(
            $py,
            'VERSION\s*=\s*"[^"]+"',
            'VERSION = "' + $version + '"',
            1
          )
          Set-Content parts_manager.py $py -Encoding UTF8

          $iss = Get-Content installer.iss -Raw -Encoding UTF8
          $iss = [regex]::Replace(
            $iss,
            '#define MyAppVersion "[^"]+"',
            '#define MyAppVersion "' + $version + '"',
            1
          )
          Set-Content installer.iss $iss -Encoding UTF8

      - name: Build installer
        shell: cmd
        run: build_windows.bat

      - name: Verify installer
        shell: pwsh
        run: |
          $path = "installer_output/PartsManager-Setup-${{ steps.version.outputs.version }}.exe"

          if (-not (Test-Path $path)) {
            throw "Installer not found: $path"
          }

          $size = (Get-Item $path).Length

          if ($size -lt 100KB) {
            throw "Installer is unexpectedly small: $size bytes"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PartsManager ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: installer_output/PartsManager-Setup-${{ steps.version.outputs.version }}.exe
